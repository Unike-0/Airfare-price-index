version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: apix_postgres
    environment:
      POSTGRES_DB: apix_db
      POSTGRES_USER: apix_user
      POSTGRES_PASSWORD: apix_pass
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U apix_user -d apix_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: apix_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    container_name: apix_backend
    environment:
      - DATABASE_URL=postgresql://apix_user:apix_pass@db:5432/apix_db
      - REDIS_URL=redis://redis:6379/0
      - JWT_SECRET=apix_secret_key_change_in_prod_12345
      - SCRAPING_ENABLED=true
      - MOCK_MODE=true
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: always

  frontend:
    build: ./frontend
    container_name: apix_frontend
    environment:
      - VITE_API_URL=http://localhost:8000
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend
    restart: always

volumes:
  postgres_data:
  redis_data:
